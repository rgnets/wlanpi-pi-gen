
name: Build image

on:
  # Allow manual runs of workflow from Actions tab
  workflow_dispatch:
    inputs:
      version-bump:
        description: Version bump
        required: true
        type: choice
        options:
          - Auto
          - Major
          - Minor
          - Patch
          - RC
          - Dev
          - Release
        default: Auto

#  schedule:
#    - cron: '37 5 * * *'
  push:
    branches:
      - force-build
      - rg-dev
      - rg-release

jobs:
  build:
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-22.04' }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Show version bump input
        run: |
          echo "Version bump input: ${{ github.event.inputs.version-bump }}"

      - name: Prepare docker output
        run: |
          touch output.env

      - name: Remove Old docker container unless continue
        if: ${{ always() && (vars.CONTINUE != 1) }}
        run: |
          sudo docker kill -v pigen_work || sudo docker rm -v pigen_work || true

      - name: Build image
        id: build-image
        env:
          REQUEST_BUMP: ${{ github.event.inputs.version-bump }}
          FIRST_USER_NAME: ${{ vars.FIRST_USER_NAME }}
          FIRST_USER_PASS: ${{ vars.FIRST_USER_PASS }}
          PRESERVE_CONTAINER: "${{ vars.PRESERVE_CONTAINER || 0 }}"
          CONTINUE: "${{ vars.CONTINUE || 0 }}"
        run: |
          last_commit_date=$(git log -1 --format=%cd --date=unix)
          last_day=$(date -d '-1 day' +%s)

          sudo docker run --rm --privileged \
            multiarch/qemu-user-static --reset -p yes


          sudo -E ./build-docker.sh -v ${{ github.workspace }}/output.env:/output.env

      - name: Load and export docker output
        run: |
          while IFS='=' read -r key value; do
            echo "Processing $key with value $value"
            echo "$key=$value" >> $GITHUB_ENV
          done < output.env
          echo "All variables from output.env have been added to GITHUB_ENV."

      - name: Generate checksum
        id: generate-checksum
        run: |
          cd deploy; for file in *.zip; do sha256sum --binary $file | sudo tee "${file}.sha256"; done; cd ../

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Set nightly artifact name
        id: set-nightly-artifact-name
        run: echo "ARTIFACT_NAME=wlanpi-nightly-${{ env.version }}~gha${{ env.date }}" >> $GITHUB_ENV

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: deploy/*.zip

      - name: Upload zipped image checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-sha256
          path: deploy/*.sha256

      - name: Upload image info
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-info
          path: deploy/*.info

      - name: Create pre-release from default branch
        if: ${{ github.event.ref == format('refs/heads/{0}', github.event.repository.default_branch)  || github.event.ref == format('refs/heads/{0}', 'rg-release')  }}
        uses: "joshschmelzle/action-automatic-releases@1c60c2dcfeb5382b81099310bdb4a376dc7753a0"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: ${{ env.version }}
          prerelease: true
          files: |
            deploy/*.zip
            deploy/*.info
            deploy/rg-wlanpi-os/os.json
            deploy/*.sha256

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-buildlogs
          path: deploy/*.log

      - name: Setup SSH agent and key
        if: ${{ github.event.ref == format('refs/heads/{0}', github.event.repository.default_branch)  || github.event.ref == format('refs/heads/{0}', 'rg-release') || github.event.ref == format('refs/heads/{0}', 'rg-dev')  }}
        run: |
          # Create temp directory with restrictive permissions
          export SSH_TEMP_DIR=$(mktemp -d)
          echo "SSH_TEMP_DIR=$SSH_TEMP_DIR" >> $GITHUB_ENV
          chmod 700 "$SSH_TEMP_DIR"
          
          # Create private key file
          echo "${{ secrets.BUILD_SERVER_PRIVATE_KEY }}" > "$SSH_TEMP_DIR/build_id"
          echo "${{ secrets.JUMP_SERVER_PRIVATE_KEY }}" > "$SSH_TEMP_DIR/jump_id"
          chmod 600 "$SSH_TEMP_DIR/*_id"
          
          # Start SSH agent and capture PID/socket
          eval $(ssh-agent -s)
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          
          # Add key to agent
          ssh-add "$SSH_TEMP_DIR/build_id"
          ssh-add "$SSH_TEMP_DIR/jump_id"
          
          # Setup known hosts
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.JUMP_SERVER }} >> ~/.ssh/known_hosts
          ssh ${{ vars.JUMP_SERVER_USER }}@${{ vars.JUMP_SERVER }} "ssh-keyscan -H ${{ vars.BUILD_SERVER }}" >> ~/.ssh/known_hosts

      - name: Upload release to build server
        if: ${{ github.event.ref == format('refs/heads/{0}', github.event.repository.default_branch)  || github.event.ref == format('refs/heads/{0}', 'rg-release')  }}
        run: |
          cd deploy
          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              BUILD_SERVER_PATH=${{ vars.BUILD_SERVER_PATH_RELEASE }} ../upload.sh "$file"
            fi
          done

      - name: Upload beta to build server
        if: ${{ github.event.ref == format('refs/heads/{0}', 'rg-dev')  }}
        run: |
          cd deploy
          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              BUILD_SERVER_PATH=${{ vars.BUILD_SERVER_PATH_BETA }} ../upload.sh "$file"
            fi
          done

      - name: Cleanup SSH agent and keys
        if: ${{ always()  }}
        run: |
          # Kill SSH agent if it exists
          if [ -n "$SSH_AGENT_PID" ]; then
            echo "Killing SSH agent (PID: $SSH_AGENT_PID)"
            kill $SSH_AGENT_PID || true
          fi
          
          # Remove temporary directory and key files
          if [ -n "$SSH_TEMP_DIR" ] && [ -d "$SSH_TEMP_DIR" ]; then
            echo "Removing temporary SSH directory"
            rm -rf "$SSH_TEMP_DIR"
          fi
          
          # Clear SSH auth socket
          unset SSH_AUTH_SOCK
          unset SSH_AGENT_PID

      - name: Chown the dir for next time
        if: always()
        run: |
          sudo chown -R ubuntu:ubuntu ./* || true

  slack-workflow-status:
    if: ${{ always() && (github.repository_owner == 'WLAN-Pi') && (! github.event.pull_request.head.repo.fork) }}
    name: Post Workflow Status to WLAN-Pi Slack
    needs:
      - build
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-22.04' }}"
    steps:
      - name: Slack Workflow Notification
        uses: Gamesight/slack-workflow-status@master
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
